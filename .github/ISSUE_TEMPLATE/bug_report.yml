name: Bug report
description: Report reproducible ContextDeck behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove private text, paths, filenames, serial numbers, and credentials from logs.
  - type: input
    id: version
    attributes:
      label: ContextDeck version
      placeholder: 0.1.8
    validations:
      required: true
  - type: input
    id: streamdeck
    attributes:
      label: Stream Deck software and device
      placeholder: Stream Deck 7.x, Stream Deck +
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the foreground application, selection type, and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private content, paths, filenames, serial numbers, and credentials.
          required: true
